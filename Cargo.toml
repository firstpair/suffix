[package]
name = "suffix"
version = "0.1.0"
edition = "2024"
description = "Rust CLI client for suffix.org"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
open = "5.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
url = "2.5"
urlencoding = "2.1"
